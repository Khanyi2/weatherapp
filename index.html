<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/index.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form class="search-form">
          <input
            type="search"
            placeholder="Enter a city..."
            required
            class="search-form-input"
          />
          <input type="submit" value="Search" class="search-form-button" />
        </form>
      </header>

      <main>
        <div class="weather-app-data">
          <div>
            <h1 class="weather-app-city">Paris</h1>
            <p class="weather-app-details">
              Tuesday 20:46, scattered clouds
              <br />
              Humidity: 66% Wind:3.13km/h
            </p>
          </div>
          <div class="weather-app-temp-container">
            <div class="weather-app-icon">🌤️</div>
            <div class="weather-app-temp">12</div>
            <div class="weather-app-unit">°C</div>
          </div>
        </div>
      </main>

      <footer>
        Coded by
        <a href="https://github.com/Khanyi2" target="_blank">Khanyi Sefalane</a>
        code hosted on
        <a href="https://github.com/Khanyi2/weatherapp" target="_blank"
          >Github</a
        >
        and website hosted on Netlify
      </footer>
    </div>
  </body>
</html>
